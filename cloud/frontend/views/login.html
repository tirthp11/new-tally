<div class="login-wrap">
  <div class="login-box">
    <img src="/assets/logo.png" alt="Asia Bulk Sacks">
    <h1>Asia Bulk Sacks - Tally Suite</h1>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" id="login-pw-toggle" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
      <p id="login-error" class="muted" style="color: var(--danger);"></p>
    </form>
  </div>
</div>
